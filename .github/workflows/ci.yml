name: Runtime CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x86-64:
    name: Linux x86-64 / Clang
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: x86port
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SomeoneIsWorking/jit-common
          ref: 03ac795cbc39843e795cb8091fb96bff2b1c9017
          path: jit-common
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.10.12
          python-version: 3.12.13
          enable-cache: false
      - name: Install native verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends clang clang-format clang-tidy cmake ninja-build
      - name: Verify the x64 product and oracle fixtures
        working-directory: x86port
        run: uv run --frozen python tools/verify.py --build-dir build/ci/linux-x86-64 --cc clang --cxx clang++

  macos:
    name: macOS ${{ matrix.arch }} / Apple Clang
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86-64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: x86port
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SomeoneIsWorking/jit-common
          ref: 03ac795cbc39843e795cb8091fb96bff2b1c9017
          path: jit-common
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.10.12
          python-version: 3.12.13
          enable-cache: false
      - name: Install native verification tools
        run: |
          brew install llvm ninja
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - name: Verify the native product and oracle fixtures
        working-directory: x86port
        run: uv run --frozen python tools/verify.py --build-dir build/ci/macos-${{ matrix.arch }} --cc /usr/bin/clang --cxx /usr/bin/clang++

  windows-x86-64:
    name: Windows x86-64 / clang-cl
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: x86port
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SomeoneIsWorking/jit-common
          ref: 03ac795cbc39843e795cb8091fb96bff2b1c9017
          path: jit-common
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.10.12
          python-version: 3.12.13
          enable-cache: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: amd64
      - name: Verify the MSVC-compatible LLVM toolchain
        shell: pwsh
        run: |
          where.exe clang-cl
          where.exe llvm-nm
          clang-cl --version
      - name: Verify the x64 product and oracle fixtures
        working-directory: x86port
        shell: pwsh
        run: uv run --frozen python tools/verify.py --build-dir build/ci/windows-x86-64 --cc clang-cl --cxx clang-cl
